name: Firmware checks
on:
  push:
    branches: [main, codex/prototype-experiments]
  pull_request:
  workflow_dispatch:
concurrency:
  group: firmware-prototype-${{ github.event_name }}
  cancel-in-progress: true
permissions:
  contents: write
  pages: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cryptographic test dependency
        run: sudo apt-get update -qq && sudo apt-get install -y libmbedtls-dev
      - name: Test portable firmware logic
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -fsanitize=undefined,address -I libraries/RainLink/src tests/logic_test.cpp -o /tmp/rain-logic-test
          /tmp/rain-logic-test
          node tests/portal_test.mjs
          node tests/coverage_test.mjs
          c++ -std=c++17 -Wall -Wextra -Werror -I libraries/RainLink/src tests/log_test.cpp -o /tmp/rain-log-test
          /tmp/rain-log-test
          node --check docs/app.mjs
          node --check docs/sw.js
          c++ -std=c++17 -Wall -Wextra -Werror -I libraries/RainLink/src tests/crypto_test.cpp -lmbedcrypto -o /tmp/rain-crypto-test
          /tmp/rain-crypto-test
      - uses: arduino/setup-arduino-cli@v2
      - uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-${{ runner.os }}-esp32-3.3.2-radio-7.8.1-u8g2-2.36.17
      - name: Install pinned build dependencies
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.2 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install 'RadioLib@7.8.1' 'U8g2@2.36.17'
      - name: Compile public unpaired firmware
        run: |
          arduino-cli compile --fqbn esp32:esp32:heltec_wifi_lora_32_V3 --libraries libraries --output-dir artifacts/TX Emisor
          arduino-cli compile --fqbn esp32:esp32:heltec_wifi_lora_32_V3 --libraries libraries --output-dir artifacts/RX Receptor
          arduino-cli compile --fqbn esp32:esp32:heltec_wifi_lora_32_V3 --libraries libraries --build-property compiler.cpp.extra_flags=-DRAIN_CONTACT_NC=1 --output-dir artifacts/RX-NC Receptor
      - name: Publish public development binaries
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp artifacts/TX/Emisor.ino.bin artifacts/LoraRainSensor-Emisor.bin
          cp artifacts/RX/Receptor.ino.bin artifacts/LoraRainSensor-Receptor-NO.bin
          cp artifacts/RX-NC/Receptor.ino.bin artifacts/LoraRainSensor-Receptor-NC.bin
          sha256sum artifacts/LoraRainSensor-*.bin > artifacts/SHA256SUMS.txt
          gh release view v1.3.0-prototype || gh release create v1.3.0-prototype --target "${{ github.event.pull_request.head.sha || github.sha }}" --prerelease --title 'LoraRainSensor 1.3.0 prototype' --notes 'Public unpaired application binaries for Heltec V3. Configure the same private LoRa key locally on both devices. Receiver variants NO and NC must match wiring. Development release; hardware acceptance tests pending. Upload these application binaries using OTA or at application offset 0x10000 over USB; keep the default 8 MB partition table.'
          zip -qr artifacts/LoraRainSensor-GPS.zip docs
          gh release upload v1.3.0-prototype artifacts/LoraRainSensor-*.bin artifacts/SHA256SUMS.txt artifacts/LoraRainSensor-GPS.zip --clobber
      - name: Enable HTTPS companion app on Pages
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPO/pages" >/dev/null 2>&1 || gh api --method POST "repos/$GH_REPO/pages" -f 'source[branch]=codex/prototype-experiments' -f 'source[path]=/docs'
          gh api --method POST "repos/$GH_REPO/pages/builds"
